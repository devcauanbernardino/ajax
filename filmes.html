<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de filmes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-light bg-light mb-4">
      <div class="container">
        <div class="navbar-brand mb-0 h1">
          <h3>Catálogo de filmes</h3>
        </div>
      </div>
    </nav>

    <div class="container" id="lista">
      <div class="row">
        <div class="col">
          <button
            type="button"
            class="btn btn-success mb-5"
            onclick="getFilmes()"
          >
            Listar filmes
          </button>
        </div>
      </div>
    </div>

    <script src="xmltojson.js"></script>
    <script>
      function getFilmes() {
          let xmlHttp = new XMLHttpRequest();
          xmlHttp.open('GET', 'http://localhost/ajax/filmes.xml')

          xmlHttp.onreadystatechange = () => {
              if (xmlHttp.readyState == 4 && xmlHttp.status == 200) {
                  let XMLFilmes = xmlHttp.responseText
                //   console.log(XMLFilmes)

                  let parser = new DOMParser()

                  //faz com que o responsetext(string) vire uma arvore de elementos
                  domFilmes = parser.parseFromString(XMLFilmes, 'text/xml')
                //   console.log(domFilmes)

                  jsonFilmes = xmlToJson(domFilmes)
                console.log(jsonFilmes)


                  //percorrendo cada filme
                  for(let i in jsonFilmes['filmes']['filme']) {
                    let item = jsonFilmes['filmes']['filme'][i]

                    //criando os elementos para colocar as informacoes dos filmes
                    let divRow = document.createElement('div')
                    divRow.classList.add('row')

                    let divCol = document.createElement('div')
                    divCol.classList.add('col')

                    let titulo = document.createElement('h1')
                    titulo.innerHTML = '<h1>Título:</h1> ' + item['titulo']['#text']

                    let p1 = document.createElement('p')
                    p1.innerHTML = '<p><strong>Resumo:</strong> ' + item['resumo']['#text'] + '</p>'

                    let genero = ''
                    for (let g in item.genero) {
                        if (genero) genero += ', '
                        genero += item.genero[g]['#text']
                    }
                    let p2 = document.createElement('p')
                    p2.innerHTML = '<p><strong>Gênero:</strong> ' + genero + '</p>'

                    let elenco = ''
                    for (let e in item.elenco.ator) {
                        if (elenco) elenco += ', '
                        elenco += item.elenco.ator[e]['#text']
                    }
                    let p3 = document.createElement('p')
                    p3.innerHTML = '<p><strong>Elenco:</strong> ' + elenco + '</p>'

                    let p4 = document.createElement('p')
                    p4.innerHTML = '<p><strong>Data de lançamento:</strong> ' + item.dataLancamento['#text'] + ' (' + item.dataLancamento['@attributes']['pais'] + ')' + '</p>'

                    let hr = document.createElement('hr')

                    divRow.appendChild(divCol)
                    divCol.appendChild(titulo)
                    divCol.appendChild(p1)
                    divCol.appendChild(p2)
                    divCol.appendChild(p3)
                    divCol.appendChild(p4)
                    divCol.appendChild(hr)

                    document.getElementById('lista').appendChild(divRow)
                  }

                // <div class="row">
                //     <div class="col">
                //         <p><strong>Título:</strong> Título do filme</p>
                //         <p><strong>Resumo:</strong> Resumo do filme</p>
                //         <p><strong>Gênero:</strong> Gênero do filme</p>
                //         <p><strong>Elenco:</strong> Elenco do filme</p>
                //         <p><strong>Data de lançamento:</strong> Data de lançamento do filme</p>
                //         <hr>
                //     </div>
                // </div>

              }

              if (xmlHttp.readyState == 4 && xmlHttp.status == 404) {
                  //pagina nao encontrada
              }
          }

          xmlHttp.send()

      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
