<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Requisições assíncronas</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h4">
                Requisições síncronas e assíncronas
            </span>
        </div>
    </nav>

    <div class="container">

        <!-- Navegação -->
        <div class="row mb-4">
            <div class="col text-center">
                <a href="#" class="btn btn-primary me-2" onclick="requisitarPagina('pagina_1_conteudo.php')">Página 1</a>
                <a href="#" class="btn btn-primary me-2" onclick="requisitarPagina('pagina_2_conteudo.php')">Página 2</a>
                <a href="#" class="btn btn-primary" onclick="requisitarPagina('pagina_3_conteudo.php')">Página 3</a>
            </div>
        </div>

        <!-- Conteúdo -->
        <div class="row">
            <div class="col-md-10 offset-md-1" id="conteudo">
                
            </div>
        </div>

    </div>
    <script>

        function requisitarPagina(url) {
            document.getElementById('conteudo').innerHTML = ''
            //incluir o gif de loading na pagina
            if (!document.getElementById('loading')) {
                let imgLoading = document.createElement('img')
                imgLoading.id = 'loading'
                imgLoading.src = 'loading.gif'
                imgLoading.classList = 'rounded mx-auto d-block'

                document.getElementById('conteudo').appendChild(imgLoading)
                
            }


            let ajax = new XMLHttpRequest();


            //requisicao nao iniciada, state = 0
            //console.log(ajax.readyState)

            ajax.open('GET', url)
            //server connection established, state = 1
            //console.log(ajax.readyState)
            

            //de alguma logica que fique olhando para o progresso da requisicao, retorna todo o progresso da requisicao
            ajax.onreadystatechange = () => {
                if (ajax.readyState == 4 && ajax.status == 200) {
                    document.querySelector('#conteudo').innerHTML = ajax.responseText
                    console.log('Requisicao finalizada, o status e: ' + ajax.status)
                }

                if (ajax.readyState == 4 && ajax.status == 404) {
                    console.log('Tente novamente mais tarde...')

                }
            }



            //ajax.open('GET', url)
            //ajax.send()
            
            ajax.send()
            //console.log(ajax)

        }

    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
