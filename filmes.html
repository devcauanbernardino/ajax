<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-light bg-light mb-4">
        <div class="container">
            <div class="navbar-brand mb-0 h1">
                <h3>Catálogo de filmes</h3>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="row">
            <div class="col">
                <button type="button"  class="btn btn-success" onclick="getFilmes()">Listar filmes</button>
            </div>
        </div>
    </div>


    <script src="xmltojson.js"></script>
    <script>
        function getFilmes() {
            let xmlHttp = new XMLHttpRequest();
            xmlHttp.open('GET', 'http://localhost/ajax/filmes.xml')

            xmlHttp.onreadystatechange = () => {
                if (xmlHttp.readyState == 4 && xmlHttp.status == 200) {
                    let XMLFilmes = xmlHttp.responseText
                    console.log(XMLFilmes)

                    let parser = new DOMParser()

                    //faz com que o responsetext(string) vire uma arvore de elementos
                    domFilmes = parser.parseFromString(XMLFilmes, 'text/xml')
                    console.log(domFilmes)

                    jsonFilmes = xmlToJson(domFilmes)
                    console.log(jsonFilmes)

                }

                if (xmlHttp.readyState == 4 && xmlHttp.status == 404) {
                    //pagina nao encontrada
                }
            }

            xmlHttp.send()

        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
